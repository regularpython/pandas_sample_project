name: Deploy Glue Script to S3

on:
  push:
    branches:
      - master  # Triggers the deployment when you push to the main branch
    paths:
      - 'transform_clean_rental_cars_silver.py' # Only runs if this script changes

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out your repository code so the runner can see it
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Configure AWS credentials securely using GitHub Secrets
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1 # Change this to your actual AWS region (e.g., us-west-2, ap-south-1)

    # Step 3: Copy the script file directly to your target S3 path
    - name: Deploy Script to S3
      run: |
        aws s3 cp transform_clean_rental_cars_silver.py s3://jun-08-2026-batch/glue-jobs/transform_clean_rental_cars_silver.py
